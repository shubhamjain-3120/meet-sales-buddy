<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Buddy — interaction preview</title>
  <link rel="stylesheet" href="/preview/preview.css">
  <script src="/extension/core.js" defer></script>
  <script src="/extension/strip.js" defer></script>
  <script src="/preview/demo.js" defer></script>
</head>
<body>
  <main class="meeting">
    <div class="tile client"><div class="avatar">C</div><span>Client</span></div>
    <div class="tile partner"><div class="avatar">A</div><span>Alex</span></div>
    <div class="tile you"><div class="avatar">S</div><span>You</span></div>
  </main>
  <footer class="meet-footer"><span>10:30 AM · Sales call</span><div class="meet-controls"><button aria-label="Microphone">Mic</button><button aria-label="Camera">Camera</button><button aria-label="Present">Present</button><button class="hangup">Leave</button></div><span>3 participants</span></footer>
  <aside class="demo-controls">
    <span>Interaction preview</span>
    <button id="partner-message">Partner sends message</button>
    <button id="partner-claim">Partner claims</button>
    <button id="connection">Disconnect partner</button>
  </aside>
</body>
</html>
